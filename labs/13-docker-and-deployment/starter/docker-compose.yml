# Starter docker-compose.yml — Exercise 3.
#
# This is deliberately wrong in two ways:
#
# 1. DATABASE_URL points the api service at "localhost" for Postgres.
#    Inside the api container, "localhost" means the api container
#    itself — there is no Postgres listening there. Fix it to use the
#    service name Compose gives the db container on the shared network.
#
# 2. depends_on only waits for the db container to START, not for
#    Postgres inside it to actually be ready to accept connections.
#    Add a healthcheck to db and a healthcheck-gated depends_on on api,
#    then reason about what you saw before you added it.

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:app@localhost:5432/appdb?sslmode=disable
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
