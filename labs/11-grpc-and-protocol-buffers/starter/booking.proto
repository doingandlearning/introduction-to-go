// booking.proto -- STARTER
//
// This is real, plain-text protobuf. Copy it into your own working
// directory with a real protoc + Go plugin toolchain and run:
//
//   protoc --go_out=. --go_opt=paths=source_relative \
//          --go-grpc_out=. --go-grpc_opt=paths=source_relative \
//          booking.proto
//
// TODO (Exercise 4): add a ListBookings server-streaming RPC here once
// GetBooking is working end to end.
//
// TODO (Exercise 5): practice reserving a field number safely.

syntax = "proto3";

package booking;

option go_package = "example.com/grpc-protobuf/bookingpb";

message Booking {
  string id = 1;
  string guest = 2;
  int32 nights = 3;
}

message GetBookingRequest {
  string id = 1;
}

service BookingService {
  rpc GetBooking(GetBookingRequest) returns (Booking);
}
